version: "3.8"

services:

  frontend:
    build: ./frontend
    container_name: taskflow-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - taskflow-network



  backend:
    build: ./backend
    container_name: taskflow-backend

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: mysecretkey


    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:3000/health"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


    networks:
      - taskflow-network




  postgres:

    image: postgres:latest

    container_name: taskflow-postgres


    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskflow


    volumes:
      - postgres-data:/var/lib/postgresql


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


    networks:
      - taskflow-network





  redis:

    image: redis:latest

    container_name: taskflow-redis


    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


    networks:
      - taskflow-network





networks:

  taskflow-network:


volumes:

  postgres-data: