version: "3.8"

services:

  frontend:

    image: ${DOCKERHUB_USERNAME}/taskflow-frontend:latest

    container_name: taskflow-frontend-deploy

    ports:
      - "8080:80"

    depends_on:

      backend:
        condition: service_healthy

    networks:
      - taskflow-network





  backend:

    image: ${DOCKERHUB_USERNAME}/taskflow-backend:latest

    container_name: taskflow-backend-deploy

    ports:
      - "3000:3000"


    environment:

      PORT: ${PORT}

      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: ${REDIS_URL}

      JWT_SECRET: ${JWT_SECRET}



    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy




    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:3000/health"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



    networks:
      - taskflow-network






  postgres:

    image: postgres:latest

    container_name: taskflow-postgres-deploy


    environment:

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}



    volumes:

      - postgres-data:/var/lib/postgresql/data



    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



    networks:

      - taskflow-network







  redis:

    image: redis:latest

    container_name: taskflow-redis-deploy



    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



    networks:

      - taskflow-network





networks:

  taskflow-network:





volumes:

  postgres-data: